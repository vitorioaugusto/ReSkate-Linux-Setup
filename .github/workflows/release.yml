name: Build and publish release

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "src/**"
      - "Makefile"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate setup script
        run: bash -n scripts/reskate-setup.sh

      - name: Build static executable
        run: make static

      - name: Package executable
        run: |
          chmod +x ReSkate-Setup-x86_64
          tar -czf ReSkate-Setup-x86_64.tar.gz ReSkate-Setup-x86_64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.1
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ReSkate-Setup-x86_64 ReSkate-Setup-x86_64.tar.gz --clobber
          else
            gh release create "$TAG" ReSkate-Setup-x86_64 ReSkate-Setup-x86_64.tar.gz --target "$GITHUB_SHA" --title "ReSkate Linux Setup v0.1.1" --notes "Adds game installation path confirmation before setup begins, including detection of additional Steam libraries on other drives."
          fi
